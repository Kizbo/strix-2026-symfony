x-app: &app
  build: .
  environment:
    APP_SECRET: ${APP_SECRET:-change_me_in_production}
    DATABASE_URL: postgresql://app:app@db:5432/app?serverVersion=16&charset=utf8
    MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0&check_delayed_interval=0
    WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change_me}
    NOTIFIER_URL: http://notifier:8080

services:
  db:
    image: postgres:16.16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "app"]
      interval: 2s
      retries: 30

  migrate:
    <<: *app
    command: ["php", "bin/console", "doctrine:migrations:migrate", "--no-interaction", "--allow-no-migration"]
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "-vv"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      notifier:
        condition: service_healthy

  nginx:
    image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      # First free host port from the range; `docker compose port nginx 80` shows which one.
      - "${HTTP_PORT:-8080-8099}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      # GET on the POST-only webhook route: 405 from Symfony means nginx, php-fpm and the app are up.
      test: ["CMD-SHELL", "wget -qS -O /dev/null http://127.0.0.1/api/v1/webhooks/payment 2>&1 | grep -q ' 405'"]
      interval: 3s
      retries: 20

  notifier:
    image: php:8.4.27-cli-alpine@sha256:b9014f1cc1983827459faed83b315a40ead9860bdadefc042b31f1540ef8c746
    command: ["php", "-S", "0.0.0.0:8080", "/srv/server.php"]
    environment:
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0.3}
      MOCK_FAILURE_STATUS: ${MOCK_FAILURE_STATUS:-503}
    volumes:
      - ./docker/notifier/server.php:/srv/server.php:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 2s
      retries: 20

volumes:
  db-data:
